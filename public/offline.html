<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>WordsBook · 离线</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 25% 0, #ddecff, transparent 48%), #f2f2f7;
        color: #1c1c1e;
      }
      main {
        width: min(24rem, 100%);
        text-align: center;
        padding: 2rem 1.5rem;
        border: 1px solid rgba(60, 60, 67, .14);
        border-radius: 24px;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .08);
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 8px 22px rgba(0, 122, 255, .2);
      }
      h1 {
        margin: 1rem 0 .35rem;
        letter-spacing: -.04em;
      }
      p {
        margin: 0;
        color: #48484a;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.svg" alt="" />
      <h1>WordsBook</h1>
      <p>当前处于离线状态。已下载的词典与学习内容仍然可用，重新联网后即可更新资源。</p>
    </main>
  </body>
</html>
